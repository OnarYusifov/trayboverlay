name: Client release

# Builds the Windows installer for the Trayb Client and publishes a GitHub release.
# Trigger: push a tag v<version> that matches client/package.json (e.g. v0.3.4), or run by hand.
# The tag must be v${version}: the nsis-web stub downloads its payload from the release at that tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, must match client/package.json version (e.g. v0.3.4)"
        required: true
        default: "v0.3.4"
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    defaults:
      run:
        working-directory: client
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Check the tag matches client/package.json
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != package version $pkg; the nsis-web installer would 404"; exit 1; }

      - run: yarn install --immutable

      - name: Build Windows installer
        run: yarn build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: trayb-client-windows
          path: |
            client/dist/**/*.exe
            client/dist/**/*.blockmap
            client/dist/**/*.yml
            client/dist/**/*.7z
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Trayb Client ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          body: |
            Trayb Client, based on Spectra-Client v0.3.4. Observer and player default to the Trayb server.

            Install **Trayb-Client-Setup.exe**. The installer offers Observer and Player shortcuts.
          files: |
            client/dist/**/*.exe
            client/dist/**/*.blockmap
            client/dist/**/*.yml
            client/dist/**/*.7z
