name: Images

# Builds the server and overlay images and pushes them to GHCR, tagged main and sha-<7>.
# Dokploy only pulls them, so the shared VPS never runs a build (docs/operations.md).
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [server, frontend]
    name: image (${{ matrix.component }})
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/onaryusifov/trayboverlay-${{ matrix.component }}:main
            ghcr.io/onaryusifov/trayboverlay-${{ matrix.component }}:sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=trayboverlay ${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
