---
services:
  valo-trayb-server:
    image: trayb/server
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5100"
      - "5101"
      - "5200"
    volumes:
      - ./keys:/app/keys
    environment:
      - INSECURE=${INSECURE:-true}
      - REQUIRE_AUTH_KEY=${REQUIRE_AUTH_KEY:-false}
      - USE_BACKEND=${USE_BACKEND:-false}
      - OVERLAY_AUTH_TOKEN=${OVERLAY_AUTH_TOKEN}
      - BRAND_LOGO_URL=${BRAND_LOGO_URL:-}
      - BRAND_ICON_URL=${BRAND_ICON_URL:-}
